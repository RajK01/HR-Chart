<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CAI Software — HR Organisation Chart</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'Inter',sans-serif;
  --bg:#060c1a;
  --surface:rgba(8,16,34,0.96);
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);
  --text:#e8edf8;--text2:#7a8daa;--text3:#4a5870;
  --accent:#1d8ce0;--accent2:#3ba3f0;
  --gl:rgba(29,140,224,0.32);
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 45% at 8% 4%, rgba(29,140,224,.07) 0%,transparent 60%),
    radial-gradient(ellipse 65% 50% at 88% 92%, rgba(12,140,130,.05) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(29,140,224,.03) 0%,transparent 70%);
  color:var(--text);min-height:100vh;overflow-x:hidden;
}
/* Subtle grid */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 75% 75% at 50% 50%,rgba(0,0,0,.55) 0%,transparent 100%);
}

/* ══ HEADER ══ */
header{
  position:relative;z-index:200;display:flex;align-items:center;
  padding:0 32px;height:66px;
  background:rgba(5,10,22,.97);
  backdrop-filter:blur(32px);
  border-bottom:1px solid var(--border);
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 8%,rgba(29,140,224,.3) 35%,rgba(29,140,224,.3) 65%,transparent 92%);
  pointer-events:none;
}
.cai-logo{display:flex;align-items:center;flex-shrink:0;height:30px;text-decoration:none;opacity:.92;transition:opacity .15s}
.cai-logo:hover{opacity:1}
.cai-logo svg{height:30px;width:auto}
.hpipe{width:1px;height:26px;background:var(--border);margin:0 22px;flex-shrink:0}
.htag{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.hr-chips{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:5px;padding:5px 13px;font-size:11px;color:var(--text2);white-space:nowrap;letter-spacing:.15px;
}
.chip b{color:var(--text);font-weight:700}
.ping{width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0;animation:ping 2.5s ease-in-out infinite}
@keyframes ping{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}60%{box-shadow:0 0 0 5px rgba(34,197,94,0)}}

/* ══ TOOLBAR ══ */
.bar{
  position:relative;z-index:200;display:flex;align-items:center;gap:12px;
  padding:10px 32px;background:rgba(5,10,22,.82);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.sw{position:relative;flex-shrink:0}
.sw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
#search{
  width:240px;padding:8px 14px 8px 35px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:6px;font-size:12px;color:var(--text);outline:none;
  font-family:var(--font);transition:all .18s;letter-spacing:.1px;
}
#search::placeholder{color:var(--text3)}
#search:focus{background:rgba(29,140,224,.07);border-color:rgba(29,140,224,.38);box-shadow:0 0 0 3px rgba(29,140,224,.07)}
#bc{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--text3);min-width:0}
.bch,.bln{cursor:pointer;color:var(--accent2);font-weight:600;white-space:nowrap}
.bch:hover,.bln:hover{color:#fff}
.bsp{color:var(--text3)}
.bcu{color:var(--text);font-weight:700;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.tbar-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 15px;border-radius:6px;
  font-size:11.5px;font-weight:600;font-family:var(--font);cursor:pointer;
  transition:all .18s;letter-spacing:.2px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text2);
}
.tbar-btn:hover{background:rgba(255,255,255,.07);border-color:var(--border2);color:var(--text)}
#editBtn.active{background:rgba(29,140,224,.13);border-color:rgba(29,140,224,.38);color:var(--accent2)}
#editBtn.active:hover{background:rgba(29,140,224,.2)}

/* ══ TREE ══ */
#tree{position:relative;z-index:5;padding:48px 24px 120px;overflow-x:auto;min-height:calc(100vh - 138px)}
.tree-title{
  text-align:center;margin-bottom:40px;
  font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text3);
}

/* ══ LAYOUT ══ */
.tcol{display:flex;flex-direction:column;align-items:center}
.trow{display:flex;align-items:flex-start;gap:20px;justify-content:center;flex-wrap:nowrap}
.vl{width:1px;align-self:center;background:linear-gradient(to bottom,rgba(29,140,224,.45),rgba(29,140,224,.04))}
.hl{height:1px;background:linear-gradient(90deg,transparent,rgba(29,140,224,.35),transparent)}
.cv{width:1px;height:22px;align-self:center;background:linear-gradient(to bottom,rgba(29,140,224,.35),rgba(29,140,224,.04))}

/* ══ CARD ══ */
.card{width:200px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;isolation:isolate}
.card.leaf{cursor:default}
.card.smatch .orb-ring{outline:2px solid rgba(234,179,8,.65);outline-offset:4px;box-shadow:0 0 18px rgba(234,179,8,.4)!important}

/* ── AVATAR ── */
.orb-wrap{position:relative;z-index:2}
.orb-ring{
  width:76px;height:76px;border-radius:50%;
  background:linear-gradient(145deg,var(--c1l,#3aa5e0),var(--c1,#1a7cc1) 52%,var(--c1d,#0e5f9a));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;color:#fff;letter-spacing:-.5px;
  text-shadow:0 2px 10px rgba(0,0,0,.45);
  border:2px solid rgba(255,255,255,.10);
  box-shadow:0 4px 22px var(--gl,rgba(26,124,193,.35)),inset 0 1px 0 rgba(255,255,255,.14);
  position:relative;overflow:hidden;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s;
}
.orb-ring::before{
  content:'';position:absolute;top:-22%;left:-18%;width:48%;height:48%;
  border-radius:50%;background:rgba(255,255,255,.18);filter:blur(6px);pointer-events:none;
}
.card:not(.leaf):hover .orb-ring,.card.expanded .orb-ring{
  transform:scale(1.08);
  box-shadow:0 8px 36px var(--gl,rgba(26,124,193,.55)),inset 0 1px 0 rgba(255,255,255,.14),0 0 0 4px rgba(255,255,255,.05);
}
.sdot{
  position:absolute;bottom:3px;right:3px;width:11px;height:11px;border-radius:50%;
  background:var(--dot,#22c55e);border:2px solid var(--bg);
  box-shadow:0 0 5px var(--dot,rgba(34,197,94,.5));
}

/* ── BADGE ── */
.badge-float{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  white-space:nowrap;z-index:3;
  font-size:7px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  background:rgba(5,10,22,.97);color:var(--bt,#7ec8f0)!important;
  border:1px solid var(--bb,rgba(29,140,224,.38));
  border-radius:3px;padding:2px 8px;
}

/* ── PANEL ── */
.panel{
  margin-top:-12px;width:100%;
  background:linear-gradient(180deg,rgba(10,18,38,.98) 0%,rgba(8,14,30,.98) 100%);
  border:1px solid rgba(255,255,255,.07);border-radius:14px;
  padding:20px 14px 14px;text-align:center;
  position:relative;z-index:1;
  backdrop-filter:blur(28px);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,border-color .25s;
  box-shadow:0 8px 32px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.03);
  display:flex;flex-direction:column;min-height:150px;overflow:hidden;
}
/* Colored top line */
.panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--c1,#1a7cc1);border-radius:14px 14px 0 0;
  opacity:.8;pointer-events:none;
}
/* Subtle inner top glow */
.panel::after{
  content:'';position:absolute;top:0;left:10%;right:10%;height:40px;
  background:linear-gradient(to bottom,var(--ba,rgba(26,124,193,.05)),transparent);
  pointer-events:none;border-radius:14px 14px 0 0;
}
.card:not(.leaf):hover .panel,.card.expanded .panel{
  transform:translateY(-4px);
  border-color:rgba(255,255,255,.11);
  box-shadow:0 20px 55px rgba(0,0,0,.65),0 0 0 1px var(--bb,rgba(29,140,224,.22));
}
.card.expanded .panel{border-color:rgba(255,255,255,.10);box-shadow:0 20px 55px rgba(0,0,0,.65),0 0 0 1px var(--bb,rgba(29,140,224,.28))}

/* ── TEXT ── */
.pname{font-size:13px;font-weight:700;color:#fff!important;margin-bottom:3px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ptitle{font-size:9.5px;color:rgba(155,170,205,.58)!important;line-height:1.5;margin-bottom:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ploc{display:flex;align-items:center;justify-content:center;gap:3px;font-size:9px;color:rgba(130,148,185,.45)!important;margin-bottom:10px}
.pfooter{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid rgba(255,255,255,.05);margin-top:auto}
.preps{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(150,168,205,.55)!important}
.preps b{color:rgba(215,228,255,.8)!important;font-weight:700}
.pvbtn{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.15px;
  padding:4px 11px;border-radius:4px;
  background:rgba(29,140,224,.11);color:var(--bt,#7ec8f0)!important;
  border:1px solid rgba(29,140,224,.2);transition:background .18s,border-color .18s;white-space:nowrap;
}
.card:not(.leaf):hover .pvbtn,.card.expanded .pvbtn{background:rgba(29,140,224,.2);border-color:rgba(29,140,224,.36);color:#dceeff!important}
.parr{display:inline-block;transition:transform .28s cubic-bezier(.34,1.56,.64,1);font-size:7px}
.card.expanded .parr{transform:rotate(90deg)}
.pnrep{font-size:9px;color:rgba(70,88,115,.55)!important;display:flex;align-items:center;gap:3px}

/* ══ ROLE THEMES ══ */
.tchro{--c1:#b87414;--c1l:#d49020;--c1d:#8a550a;--gl:rgba(184,116,20,.4);--ba:rgba(184,116,20,.1);--bt:#f0c058;--bb:rgba(184,116,20,.42);--dot:#22c55e}
.tdir {--c1:#1a7cc1;--c1l:#2e98dc;--c1d:#125e94;--gl:rgba(26,124,193,.4);--ba:rgba(26,124,193,.1);--bt:#80c8f0;--bb:rgba(26,124,193,.42);--dot:#22c55e}
.thead{--c1:#0b8c80;--c1l:#16a89a;--c1d:#076860;--gl:rgba(11,140,128,.4);--ba:rgba(11,140,128,.1);--bt:#5ee8d4;--bb:rgba(11,140,128,.42);--dot:#22c55e}
.tmgr {--c1:#167848;--c1l:#1ea860;--c1d:#0f5835;--gl:rgba(22,120,72,.4);--ba:rgba(22,120,72,.1);--bt:#70e8a0;--bb:rgba(22,120,72,.42);--dot:#22c55e}
.tspec{--c1:#6a38c4;--c1l:#8652dc;--c1d:#4e2898;--gl:rgba(106,56,196,.4);--ba:rgba(106,56,196,.1);--bt:#c8b8fd;--bb:rgba(106,56,196,.42);--dot:#fbbf24}
.texec{--c1:#105ea8;--c1l:#1a7cd0;--c1d:#0c4880;--gl:rgba(16,94,168,.4);--ba:rgba(16,94,168,.1);--bt:#80d0fc;--bb:rgba(16,94,168,.42);--dot:#38bdf8}
.tasc {--c1:#3c4e66;--c1l:#506278;--c1d:#2c3a4c;--gl:rgba(60,78,102,.35);--ba:rgba(60,78,102,.1);--bt:#96a8be;--bb:rgba(60,78,102,.38);--dot:#64748b}

/* ══ EDIT CONTROLS ══ */
.edit-controls{position:absolute;top:7px;right:7px;z-index:10;display:none;align-items:center;gap:2px}
.edit-mode .card .edit-controls{display:flex}
.ec-btn{width:22px;height:22px;border-radius:4px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
.ec-edit{background:rgba(29,140,224,.18);color:#80c8f0}
.ec-edit:hover{background:rgba(29,140,224,.45);color:#fff}
.ec-del{background:rgba(239,68,68,.14);color:#f87171}
.ec-del:hover{background:rgba(239,68,68,.38);color:#fff}

/* ── ADD BUTTON ── */
.add-report-btn{
  display:none;align-items:center;gap:5px;margin-top:8px;padding:5px 14px;
  background:rgba(29,140,224,.06);border:1px dashed rgba(29,140,224,.25);
  border-radius:6px;font-size:10.5px;font-weight:600;color:rgba(100,165,215,.65);
  cursor:pointer;transition:all .18s;font-family:var(--font);white-space:nowrap;letter-spacing:.1px;
}
.edit-mode .add-report-btn{display:flex}
.add-report-btn:hover{background:rgba(29,140,224,.16);border-color:rgba(29,140,224,.45);color:#d0e8ff}

/* ══ CHILDREN ANIM ══ */
.csec{display:flex;flex-direction:column;align-items:center;animation:popIn .26s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}

/* ══ MODAL ══ */
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(3,7,18,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{
  background:linear-gradient(180deg,#0c1730 0%,#09122a 100%);
  border:1px solid rgba(29,140,224,.2);border-radius:16px;
  padding:30px;width:100%;max-width:450px;
  box-shadow:0 32px 90px rgba(0,0,0,.78),0 0 0 1px rgba(255,255,255,.04);
  animation:mIn .2s cubic-bezier(.34,1.56,.64,1);
}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.modal-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:22px;display:flex;align-items:center;gap:8px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.06)}
.mfield{margin-bottom:14px}
.mfield label{display:block;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.mfield input,.mfield select{
  width:100%;padding:9px 13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:7px;font-size:13px;color:var(--text);outline:none;font-family:var(--font);transition:all .18s;
}
.mfield input:focus,.mfield select:focus{background:rgba(29,140,224,.08);border-color:rgba(29,140,224,.38);box-shadow:0 0 0 3px rgba(29,140,224,.07)}
.mfield select option{background:#0c1730;color:var(--text)}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06)}
.mbtn{padding:9px 22px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .18s;border:1px solid transparent;letter-spacing:.2px}
.mbtn-cancel{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.09);color:var(--text2)}
.mbtn-cancel:hover{background:rgba(255,255,255,.09);color:var(--text)}
.mbtn-save{background:var(--accent);border-color:rgba(29,140,224,.5);color:#fff}
.mbtn-save:hover{background:var(--accent2)}

/* ══ CONFIRM ══ */
.confirm-overlay{position:fixed;inset:0;z-index:1100;background:rgba(3,7,18,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.confirm-overlay.open{display:flex}
.confirm-box{background:linear-gradient(180deg,#0c1730 0%,#09122a 100%);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:28px;width:100%;max-width:340px;text-align:center;box-shadow:0 28px 70px rgba(0,0,0,.75);animation:mIn .2s ease}
.confirm-box p{font-size:14px;color:var(--text);margin-bottom:6px;font-weight:700}
.confirm-box small{font-size:11.5px;color:var(--text2);display:block;margin-bottom:22px;line-height:1.55}
.confirm-actions{display:flex;gap:8px;justify-content:center}
.mbtn-danger{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.32);color:#f87171;padding:9px 20px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .18s}
.mbtn-danger:hover{background:rgba(239,68,68,.32);color:#fff}

/* ══ LEGEND ══ */
.legend{
  position:fixed;bottom:20px;right:24px;z-index:300;
  background:rgba(5,10,22,.96);backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
}
.ltitle{font-size:8.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.lrow{display:flex;align-items:center;gap:7px;font-size:10px;color:rgba(190,210,240,.45)}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ══ THEME PANEL ══ */
.theme-wrap{position:relative;flex-shrink:0}
.theme-panel{
  position:absolute;top:calc(100% + 10px);right:0;z-index:600;
  background:rgba(5,10,22,.98);border:1px solid var(--border2);
  border-radius:13px;padding:18px;width:230px;
  box-shadow:0 20px 56px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03);
  display:none;animation:mIn .18s ease;
}
.theme-panel.open{display:block}
.theme-head{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.swatch{
  width:100%;aspect-ratio:1;border-radius:8px;border:2px solid transparent;
  cursor:pointer;transition:transform .15s,border-color .15s;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:#fff;transform:scale(1.08)}
.theme-divider{height:1px;background:var(--border);margin-bottom:14px}
.theme-custom{display:flex;align-items:center;justify-content:space-between}
.theme-custom span{font-size:11.5px;font-weight:600;color:var(--text2)}
.theme-custom input[type=color]{
  width:36px;height:28px;border:1px solid var(--border2);border-radius:6px;
  background:var(--surface2);padding:2px;cursor:pointer;
}
.theme-custom input[type=color]::-webkit-color-swatch-wrapper{padding:0;border-radius:4px}
.theme-custom input[type=color]::-webkit-color-swatch{border:none;border-radius:4px}

/* ══ STATS PANEL ══ */
.stats-wrap{position:relative;flex-shrink:0}
.stats-panel{position:absolute;top:calc(100% + 10px);right:0;z-index:600;background:rgba(5,10,22,.98);border:1px solid var(--border2);border-radius:13px;padding:20px;width:270px;box-shadow:0 20px 56px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03);display:none;animation:mIn .18s ease}
.stats-panel.open{display:block}
.sp-head{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.sp-total{display:flex;align-items:baseline;gap:6px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.sp-num{font-size:36px;font-weight:800;color:#fff;line-height:1}
.sp-lbl{font-size:11px;color:var(--text2);font-weight:600}
.sp-section{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text3);margin-bottom:9px;margin-top:14px}
.sp-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sp-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sp-rlbl{font-size:11px;color:var(--text2);flex:1}
.sp-cnt{font-size:11px;font-weight:700;color:var(--text)}
.sp-bar-wrap{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.sp-bar{height:100%;border-radius:2px;transition:width .4s ease}

/* ══ EXPORT PANEL ══ */
.exp-wrap{position:relative;flex-shrink:0}
.exp-panel{position:absolute;top:calc(100% + 10px);right:0;z-index:600;background:rgba(5,10,22,.98);border:1px solid var(--border2);border-radius:10px;padding:6px;width:170px;box-shadow:0 20px 56px rgba(0,0,0,.65);display:none;animation:mIn .18s ease}
.exp-panel.open{display:block}
.exp-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;border:none;background:none;font-family:var(--font);width:100%;text-align:left}
.exp-item:hover{background:rgba(255,255,255,.07);color:var(--text)}

/* ══ PHOTO ══ */
.photo-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:12px;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid var(--border)}
.photo-prev{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid var(--border2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--text2);flex-shrink:0}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-actions{display:flex;flex-direction:column;gap:6px;flex:1}
.photo-upload-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--border2);background:rgba(255,255,255,.04);font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .15s;width:fit-content}
.photo-upload-btn:hover{background:rgba(255,255,255,.09);color:var(--text)}
.photo-hint{font-size:10px;color:var(--text3)}
.photo-clear-btn{font-size:10px;color:rgba(239,68,68,.6);cursor:pointer;border:none;background:none;font-family:var(--font);text-align:left;padding:0;transition:color .15s}
.photo-clear-btn:hover{color:#f87171}
#fPhoto{display:none}
.orb-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}

/* ══ SEARCH HIGHLIGHT ══ */
.card.smatch .panel{border-color:rgba(234,179,8,.4)!important;box-shadow:0 0 0 2px rgba(234,179,8,.18),0 8px 32px rgba(0,0,0,.55)!important}

/* ══ EXPAND/COLLAPSE BUTTONS ══ */
.tbar-icon{padding:7px 10px!important}

/* ══ PRINT ══ */
@media print{
  header .hr-chips,.bar,.add-report-btn,.edit-controls,#confirmDel,#modal,.stats-wrap,.exp-wrap,.theme-wrap,#editBtn,button.tbar-btn{display:none!important}
  body,html{background:#fff!important;color:#111!important;background-image:none!important}
  header{background:#fff!important;border-bottom:2px solid #e2e8f0!important;box-shadow:none!important;print-color-adjust:exact}
  .cai-logo svg text{fill:#1a7cc1!important}.cai-logo svg ellipse,.cai-logo svg path,.cai-logo svg circle{stroke:#1a7cc1!important}
  #tree{padding:16px!important;min-height:unset!important}
  .panel{background:#f8faff!important;border-color:#e2e8f0!important;box-shadow:none!important;print-color-adjust:exact}
  .pname{color:#1e293b!important}.ptitle{color:#64748b!important}.ploc span,.preps,.pnrep{color:#94a3b8!important}
  .pvbtn{background:#eff6ff!important;border-color:#bfdbfe!important;color:#3b82f6!important}
  .vl,.hl,.cv{background:#bfdbfe!important;print-color-adjust:exact}
  .badge-float{background:#eff6ff!important;color:#3b82f6!important;border-color:#bfdbfe!important}
  .card:hover .panel,.card.expanded .panel{transform:none!important;box-shadow:none!important}
  .orb-ring{print-color-adjust:exact}
  @page{size:landscape;margin:8mm}
}

/* ══ RESPONSIVE ══ */
@media(max-width:900px){
  header{padding:0 18px;height:58px}.hpipe,.htag{display:none}.bar{padding:9px 18px}
  #search{width:185px}.card{width:172px}.orb-ring{width:68px;height:68px;font-size:17px}.trow{gap:14px}
}
@media(max-width:600px){
  header{padding:0 14px;height:54px}.hr-chips .chip:last-child{display:none}
  .bar{padding:8px 14px}#search{width:140px;font-size:11px}#bc{display:none}
  #tree{padding:24px 10px 80px;overflow-x:auto}.trow{gap:10px;flex-wrap:nowrap;width:max-content}
  .card{width:144px}.orb-ring{width:60px;height:60px;font-size:15px}.legend{bottom:10px;right:10px}
}
@media(max-width:400px){.card{width:122px}.orb-ring{width:52px;height:52px;font-size:13px}.trow{gap:8px}.legend{display:none}}
</style>

<body>

<header>
  <a class="cai-logo" href="https://caisoft.com" target="_blank" rel="noopener" title="CAI Software">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 44" height="30">
      <g fill="none" stroke="#1a7cc1">
        <ellipse cx="21" cy="22" rx="19" ry="19" stroke-width="1.8"/>
        <path stroke-width="1.5" d="M7,8 Q14,22 7,36"/>
        <path stroke-width="1.5" d="M13,4 Q27,22 13,40"/>
        <path stroke-width="1.5" d="M19,3 Q40,22 19,41"/>
        <path stroke-width="1.2" d="M4,13 Q21,11 38,13"/>
        <path stroke-width="1.2" d="M2,22 L40,22"/>
        <path stroke-width="1.2" d="M4,31 Q21,33 38,31"/>
      </g>
      <circle cx="7" cy="8" r="2" fill="#1a7cc1"/>
      <circle cx="35" cy="12" r="1.6" fill="#1a7cc1"/>
      <circle cx="39" cy="24" r="1.6" fill="#1a7cc1"/>
      <circle cx="28" cy="4" r="1.4" fill="#1a7cc1"/>
      <text x="48" y="31" font-family="Arial Black,Arial,sans-serif" font-size="26" font-weight="900" fill="#1a7cc1" letter-spacing="-0.5">cai</text>
    </svg>
  </a>
  <div class="hpipe"></div>
  <div class="htag">Shared Services &nbsp;·&nbsp; HR Organisation</div>
  <div class="hr-chips">
    <div class="chip"><span class="ping"></span>Live &nbsp;·&nbsp;<b id="ht">–</b>&nbsp;staff</div>
    <div class="chip">Expanded &nbsp;<b id="he">0</b></div>
  </div>
</header>

<div class="bar">
  <div class="sw">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="search" type="text" placeholder="Search name, title, location…"/>
  </div>
  <div id="bc"></div>
  <div class="bar-right">
    <button class="tbar-btn tbar-icon" onclick="doExpandAll()" title="Expand All">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
    </button>
    <button class="tbar-btn tbar-icon" onclick="doCollapseAll()" title="Collapse All">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3"/></svg>
    </button>
    <div class="stats-wrap">
      <button id="statsBtn" class="tbar-btn" onclick="toggleStatsPanel(event)">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="18" y="3" width="4" height="18" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="2" y="13" width="4" height="8" rx="1"/></svg>
        Stats
      </button>
      <div class="stats-panel" id="statsPanel"></div>
    </div>
    <div class="exp-wrap">
      <button class="tbar-btn" onclick="toggleExpPanel(event)">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
      <div class="exp-panel" id="expPanel">
        <button class="exp-item" onclick="exportPNG()">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Download PNG
        </button>
        <button class="exp-item" onclick="printChart()">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print / PDF
        </button>
      </div>
    </div>
    <div class="theme-wrap">
      <button id="themeBtn" class="tbar-btn" onclick="toggleThemePanel(event)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="16.2" cy="14" r="1.5" fill="currentColor" stroke="none"/><circle cx="7.8" cy="14" r="1.5" fill="currentColor" stroke="none"/></svg>
        Colour
      </button>
      <div class="theme-panel" id="themePanel">
        <div class="theme-head">Interface Colour</div>
        <div class="swatches" id="swatches"></div>
        <div class="theme-divider"></div>
        <div class="theme-custom">
          <span>Custom colour</span>
          <input type="color" id="customColor" value="#1d8ce0" oninput="applyCustom(this.value)"/>
        </div>
      </div>
    </div>
    <button id="editBtn" class="tbar-btn" onclick="toggleEdit()">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit Mode
    </button>
    <button class="tbar-btn" onclick="rst()">&#8635; Reset View</button>
  </div>
</div>

<div id="tree"></div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title"><span id="mIcon">✏️</span>&nbsp;<span id="mTitle">Edit Person</span></div>
    <div class="mfield"><label>Full Name</label><input id="fName" type="text" placeholder="e.g. Jane Smith"/></div>
    <div class="mfield"><label>Job Title</label><input id="fJobTitle" type="text" placeholder="e.g. HR Business Partner – EMEA"/></div>
    <div class="modal-grid">
      <div class="mfield"><label>Badge Label</label><input id="fRole" type="text" placeholder="e.g. HR Director"/></div>
      <div class="mfield"><label>Location</label><input id="fLocation" type="text" placeholder="e.g. London, UK"/></div>
    </div>
    <div class="mfield">
      <label>Level</label>
      <select id="fTheme">
        <option value="tchro">CHRO / C-Suite</option>
        <option value="tdir">Director</option>
        <option value="thead">Head / Lead</option>
        <option value="tmgr">Manager</option>
        <option value="tspec">Specialist</option>
        <option value="texec">Senior / Executive</option>
        <option value="tasc">Associate / Coordinator</option>
      </select>
    </div>
    <div class="mfield">
      <label>Profile Photo</label>
      <div class="photo-row">
        <div class="photo-prev" id="photoPreview"><span id="photoInitials">?</span></div>
        <div class="photo-actions">
          <label class="photo-upload-btn" for="fPhoto">
            <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload photo
          </label>
          <input type="file" id="fPhoto" accept="image/*" onchange="handlePhotoUpload(this)"/>
          <span class="photo-hint">JPG, PNG — replaces initials</span>
          <button class="photo-clear-btn" type="button" onclick="clearPhoto()" id="photoClearBtn" style="display:none">× Remove photo</button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="mbtn mbtn-cancel" onclick="closeModal()">Cancel</button>
      <button class="mbtn mbtn-save" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirmDel">
  <div class="confirm-box">
    <p>Remove this person?</p>
    <small id="delMsg">This action cannot be undone.</small>
    <div class="confirm-actions">
      <button class="mbtn mbtn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="mbtn mbtn-danger" onclick="confirmDelete()">Remove</button>
    </div>
  </div>
</div>


<script>
const DEFAULT_ORG={
  id:'chro',name:'Melissa Harvan',role:'Chief HR Officer',
  jobTitle:'Chief Human Resources Officer',location:'Global',t:'tchro',
  children:[
    {id:'ana',name:'Anastasija Cecurova-Herda',role:'Sr. HR Business Partner',
     jobTitle:'Senior HR Business Partner – EMEA/UK',location:'Burnley Tharstern, UK',t:'tdir',
     children:[{id:'ana1',name:'Team Member',role:'HR Executive',jobTitle:'HR Executive – EMEA',location:'UK',t:'texec',children:[]}]},
    {id:'emmy',name:'Emmy Kelley',role:'Asst. Global Operations',
     jobTitle:'Assistant, Global Operations',location:'USA – Remote',t:'tasc',children:[]},
    {id:'mary',name:'Mary Aignasse',role:'Sr. HR BP & HR Lead',
     jobTitle:'Sr. HR Business Partner & HR Lead, Americas',location:'Pittsburgh, USA',t:'thead',
     children:[
       {id:'mr1',name:'Americas Report 1',role:'HR Business Partner',jobTitle:'HR Business Partner – Americas',location:'USA',t:'texec',children:[]},
       {id:'mr2',name:'Americas Report 2',role:'HR Associate',jobTitle:'HR Associate – Americas',location:'USA',t:'tasc',children:[]},
       {id:'mr3',name:'Americas Report 3',role:'HR Coordinator',jobTitle:'HR Coordinator – Americas',location:'USA',t:'tasc',children:[]},
     ]},
    {id:'neha',name:'Neha Thapliyal',role:'HR Director, APAC',
     jobTitle:'HR Director – Asia Pacific',location:'India',t:'tdir',
     children:[
       {id:'arun',name:'Arun Kumar B',role:'HR Ops Associate',jobTitle:'HR Operations Associate',location:'India',t:'tasc',children:[]},
       {id:'chay',name:'Chayanika Khakhlari',role:'HR Operations',jobTitle:'HR Operations',location:'India',t:'texec',children:[]},
       {id:'deep',name:'Deepak Yesodharan',role:'HR Ops Specialist',jobTitle:'HR Operations Specialist',location:'India',t:'tspec',children:[]},
       {id:'muthu',name:'Muthu Lavanya S',role:'Principal TA Specialist',jobTitle:'Principal Talent Acquisition Specialist',location:'India',t:'tspec',children:[]},
     ]},
    {id:'raj',name:'Rajarshi Mukherjee',role:'HRIS Manager',
     jobTitle:'HRIS Manager & North America Payroll',location:'India',t:'tmgr',children:[]}
  ]
};

const STORE='cai_org_v1';
let ORG;
function loadOrg(){try{const s=localStorage.getItem(STORE);return s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_ORG));}catch(e){return JSON.parse(JSON.stringify(DEFAULT_ORG));}}
function saveOrg(){localStorage.setItem(STORE,JSON.stringify(ORG));}
ORG=loadOrg();

let exp=new Set(),crumbs=[],sq='',editMode=false;
let mMode='edit',mTargetId=null,mParentId=null,pendingDelId=null,pendingPhoto=null;

function cnt(n){return 1+(n.children||[]).reduce((s,c)=>s+cnt(c),0)}
function ini(n){return(n.split(' ').map(w=>w[0]||'').join('').slice(0,2)||'?').toUpperCase()}
function el(tag,cls,html){const d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d}
function genId(){return'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function findNode(n,id){if(n.id===id)return n;for(const c of(n.children||[])){const f=findNode(c,id);if(f)return f}return null}
function findParent(n,id){for(const c of(n.children||[])){if(c.id===id)return n;const f=findParent(c,id);if(f)return f}return null}
function pinSvg(){return`<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`}
function pplSvg(){return`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>`}
function plusSvg(){return`<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`}

function buildCard(node){
  const kids=(node.children||[]).length>0;
  const isExp=exp.has(node.id);
  const match=sq&&[node.name,node.role,node.location||''].some(s=>s.toLowerCase().includes(sq));
  const card=el('div',`card ${node.t}${isExp?' expanded':''}${!kids?' leaf':''}${match?' smatch':''}`);
  card.innerHTML=`
    <div class="orb-wrap">
      <div class="badge-float">${node.role}</div>
      <div class="orb-ring">${node.photo?`<img src="${node.photo}" alt="${node.name}">`:`${ini(node.name)}`}</div>
      <div class="sdot"></div>
    </div>
    <div class="panel">
      <div class="edit-controls">
        <button class="ec-btn ec-edit" title="Edit" onclick="openEdit('${node.id}',event)">✏</button>
        ${node.id!=='chro'?`<button class="ec-btn ec-del" title="Remove" onclick="openDelete('${node.id}',event)">×</button>`:''}
      </div>
      <div class="pname">${node.name}</div>
      <div class="ptitle">${node.jobTitle||''}</div>
      ${node.location?`<div class="ploc">${pinSvg()}<span>${node.location}</span></div>`:''}
      <div class="pfooter">
        ${kids
          ?`<div class="preps">${pplSvg()}&nbsp;<b>${node.children.length}</b>&nbsp;report${node.children.length!==1?'s':''}</div>
            <div class="pvbtn"><span class="parr">&#9654;</span>&nbsp;${isExp?'Collapse':'Expand'}</div>`
          :`<div class="pnrep">${pplSvg()}&nbsp;No reports</div><div></div>`}
      </div>
    </div>`;
  if(kids){
    if(window.innerWidth>768){
      card.addEventListener('mousemove',e=>{
        if(editMode)return;
        const r=card.getBoundingClientRect();
        const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
        card.style.transform=`perspective(600px) rotateY(${x*8}deg) rotateX(${-y*6}deg)`;
      });
      card.addEventListener('mouseleave',()=>{card.style.transform=''});
    }
    card.addEventListener('click',e=>{if(!e.target.closest('.edit-controls'))toggle(node)});
  }
  return card;
}

function buildTree(node,depth){
  const col=el('div','tcol');
  col.appendChild(buildCard(node));
  const kids=node.children||[];
  if(exp.has(node.id)&&kids.length>0){
    const sec=el('div','csec');
    const vl=el('div','vl');vl.style.height='28px';sec.appendChild(vl);
    if(kids.length===1){
      sec.appendChild(buildTree(kids[0],depth+1));
    } else {
      const hw=el('div');hw.style.cssText='display:flex;flex-direction:column;align-items:stretch';
      const hb=el('div','hl');hw.appendChild(hb);
      const row=el('div','trow');
      kids.forEach(kid=>{
        const dc=el('div','tcol');dc.appendChild(el('div','cv'));dc.appendChild(buildTree(kid,depth+1));row.appendChild(dc);
      });
      hw.appendChild(row);sec.appendChild(hw);
      requestAnimationFrame(()=>{
        const cols=row.querySelectorAll(':scope>.tcol');
        if(cols.length>1){
          const f=cols[0].getBoundingClientRect(),l=cols[cols.length-1].getBoundingClientRect();
          const w=hb.parentElement.getBoundingClientRect();
          hb.style.marginLeft=(f.left+f.width/2-w.left)+'px';
          hb.style.width=(l.left+l.width/2-f.left-f.width/2)+'px';
        } else hb.style.display='none';
      });
    }
    const ab=el('button','add-report-btn');
    ab.innerHTML=`${plusSvg()} Add report to ${node.name.split(' ')[0]}`;
    ab.onclick=()=>openAdd(node.id);
    sec.appendChild(ab);col.appendChild(sec);
  } else if(kids.length===0){
    const ab=el('button','add-report-btn');
    ab.innerHTML=`${plusSvg()} Add report to ${node.name.split(' ')[0]}`;
    ab.onclick=()=>openAdd(node.id);
    col.appendChild(ab);
  }
  return col;
}

function render(){
  const root=document.getElementById('tree');
  root.innerHTML='';root.classList.toggle('edit-mode',editMode);
  const w=el('div');w.style.cssText='display:flex;flex-direction:column;align-items:center';
  w.appendChild(el('div','tree-title','Shared Services Leadership'));
  w.appendChild(buildTree(ORG,0));root.appendChild(w);
  renderBC();
  document.getElementById('ht').textContent=cnt(ORG);
  document.getElementById('he').textContent=exp.size;
}
function renderBC(){
  const bc=document.getElementById('bc');bc.innerHTML='';
  const h=el('span','bch','All Staff');h.onclick=()=>{exp.clear();crumbs=[];render()};bc.appendChild(h);
  crumbs.forEach((it,i)=>{
    bc.appendChild(el('span','bsp',' › '));
    if(i===crumbs.length-1){bc.appendChild(el('span','bcu',it.name));}
    else{const lk=el('span','bln',it.name);lk.onclick=()=>{crumbs.slice(i+1).forEach(x=>clps(findNode(ORG,x.id)));crumbs=crumbs.slice(0,i+1);render()};bc.appendChild(lk);}
  });
}
function toggle(node){
  if(exp.has(node.id)){clps(node);crumbs=crumbs.filter(x=>x.id!==node.id);}
  else{exp.add(node.id);if(!crumbs.find(x=>x.id===node.id))crumbs.push({id:node.id,name:node.name});}
  render();
}
function clps(node){if(!node)return;exp.delete(node.id);(node.children||[]).forEach(c=>clps(c))}
function rst(){exp.clear();crumbs=[];document.getElementById('search').value='';sq='';render()}

document.getElementById('search').addEventListener('input',function(){
  sq=this.value.trim().toLowerCase();if(sq)exS(ORG,sq);render();
});
function exS(n,q){
  const sm=[n.name,n.role,n.location||''].some(s=>s.toLowerCase().includes(q));
  const cm=(n.children||[]).some(c=>subM(c,q));
  if((sm||cm)&&(n.children||[]).length>0)exp.add(n.id);
  (n.children||[]).forEach(c=>exS(c,q));
}
function subM(n,q){
  if([n.name,n.role,n.location||''].some(s=>s.toLowerCase().includes(q)))return true;
  return(n.children||[]).some(c=>subM(c,q));
}

function toggleEdit(){
  editMode=!editMode;
  const btn=document.getElementById('editBtn');
  btn.classList.toggle('active',editMode);
  btn.innerHTML=editMode
    ?`<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Done Editing`
    :`<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit Mode`;
  render();
}

function openEdit(id,e){
  e&&e.stopPropagation();
  const node=findNode(ORG,id);if(!node)return;
  mMode='edit';mTargetId=id;
  document.getElementById('mIcon').textContent='✏️';
  document.getElementById('mTitle').textContent='Edit Person';
  document.getElementById('fName').value=node.name;
  document.getElementById('fJobTitle').value=node.jobTitle||'';
  document.getElementById('fRole').value=node.role||'';
  document.getElementById('fLocation').value=node.location||'';
  document.getElementById('fTheme').value=node.t||'tasc';
  pendingPhoto=node.photo||null;
  document.getElementById('fPhoto').value='';
  updatePhotoPreview(node.name);
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('fName').focus(),80);
}
function openAdd(parentId){
  const parent=findNode(ORG,parentId);
  mMode='add';mParentId=parentId;
  document.getElementById('mIcon').textContent='➕';
  document.getElementById('mTitle').textContent='Add Direct Report'+(parent?` — ${parent.name}`:'');
  ['fName','fJobTitle','fRole','fLocation'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fTheme').value='tasc';
  pendingPhoto=null;document.getElementById('fPhoto').value='';updatePhotoPreview('');
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('fName').focus(),80);
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveModal(){
  const name=document.getElementById('fName').value.trim();
  if(!name){document.getElementById('fName').focus();return;}
  const data={name,jobTitle:document.getElementById('fJobTitle').value.trim(),role:document.getElementById('fRole').value.trim()||name.split(' ')[0],location:document.getElementById('fLocation').value.trim(),t:document.getElementById('fTheme').value,photo:pendingPhoto||undefined};
  if(mMode==='edit'){const node=findNode(ORG,mTargetId);if(node)Object.assign(node,data);}
  else{const parent=findNode(ORG,mParentId);if(parent){if(!parent.children)parent.children=[];parent.children.push({...data,id:genId(),children:[]});exp.add(mParentId);}}
  saveOrg();closeModal();render();
}

function openDelete(id,e){
  e&&e.stopPropagation();pendingDelId=id;
  const node=findNode(ORG,id);const kids=(node?.children||[]).length;
  document.getElementById('delMsg').textContent=kids>0?`"${node.name}" and their ${kids} direct report${kids!==1?'s':''} will be permanently removed.`:`"${node?.name}" will be permanently removed.`;
  document.getElementById('confirmDel').classList.add('open');
}
function closeConfirm(){document.getElementById('confirmDel').classList.remove('open');pendingDelId=null}
function confirmDelete(){
  if(!pendingDelId)return;
  const parent=findParent(ORG,pendingDelId);
  if(parent){parent.children=parent.children.filter(c=>c.id!==pendingDelId);exp.delete(pendingDelId);crumbs=crumbs.filter(c=>c.id!==pendingDelId);}
  saveOrg();closeConfirm();render();
}

/* ── THEME ENGINE ── */
const THEMES=[
  {name:'CAI Blue',   a:'#1d8ce0',a2:'#3ba3f0',rgb:'29,140,224'},
  {name:'Indigo',     a:'#6366f1',a2:'#818cf8',rgb:'99,102,241'},
  {name:'Violet',     a:'#7c3aed',a2:'#a78bfa',rgb:'124,58,237'},
  {name:'Teal',       a:'#0d9488',a2:'#2dd4bf',rgb:'13,148,136'},
  {name:'Emerald',    a:'#059669',a2:'#34d399',rgb:'5,150,105'},
  {name:'Amber',      a:'#d97706',a2:'#fbbf24',rgb:'217,119,6'},
  {name:'Rose',       a:'#e11d48',a2:'#fb7185',rgb:'225,29,72'},
  {name:'Slate',      a:'#64748b',a2:'#94a3b8',rgb:'100,116,139'},
];
let activeThemeIdx=0;

function buildSwatches(){
  const c=document.getElementById('swatches');c.innerHTML='';
  THEMES.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='swatch'+(i===activeThemeIdx?' active':'');
    b.style.background=t.a;b.title=t.name;
    b.onclick=()=>{applyTheme(t.a,t.a2,t.rgb);activeThemeIdx=i;document.getElementById('customColor').value=t.a;buildSwatches()};
    c.appendChild(b);
  });
}

function applyTheme(a,a2,rgb){
  const [r,g,b]=rgb.split(',').map(Number);
  const bgR=Math.min(255,6+Math.round(r*.13));
  const bgG=Math.min(255,12+Math.round(g*.13));
  const bgB=Math.min(255,26+Math.round(b*.13));
  setThemeCSS(a,a2,rgb,bgR,bgG,bgB);
  document.documentElement.style.setProperty('--accent',a);
  document.documentElement.style.setProperty('--accent2',a2);
  localStorage.setItem('cai_theme',JSON.stringify({a,a2,rgb}));
}

function setThemeCSS(a,a2,rgb,bgR,bgG,bgB){
  let s=document.getElementById('t-override');
  if(!s){s=document.createElement('style');s.id='t-override';document.head.appendChild(s);}
  s.textContent=`
    body{
      background-color:rgb(${bgR},${bgG},${bgB}) !important;
      background-image:
        radial-gradient(ellipse 80% 45% at 8% 4%, rgba(${rgb},.13) 0%,transparent 60%),
        radial-gradient(ellipse 65% 50% at 88% 92%, rgba(${rgb},.09) 0%,transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(${rgb},.06) 0%,transparent 70%) !important;
    }
    .vl{background:linear-gradient(to bottom,rgba(${rgb},.45),rgba(${rgb},.04))!important}
    .hl{background:linear-gradient(90deg,transparent,rgba(${rgb},.35),transparent)!important}
    .cv{background:linear-gradient(to bottom,rgba(${rgb},.35),rgba(${rgb},.04))!important}
    header::after{background:linear-gradient(90deg,transparent 8%,rgba(${rgb},.3) 35%,rgba(${rgb},.3) 65%,transparent 92%)!important}
    #search:focus{background:rgba(${rgb},.07)!important;border-color:rgba(${rgb},.38)!important;box-shadow:0 0 0 3px rgba(${rgb},.07)!important}
    #editBtn.active{background:rgba(${rgb},.13)!important;border-color:rgba(${rgb},.38)!important;color:${a2}!important}
    .pvbtn{background:rgba(${rgb},.11)!important;border-color:rgba(${rgb},.2)!important}
    .card:not(.leaf):hover .pvbtn,.card.expanded .pvbtn{background:rgba(${rgb},.2)!important;border-color:rgba(${rgb},.36)!important}
    .add-report-btn{background:rgba(${rgb},.06)!important;border-color:rgba(${rgb},.25)!important}
    .add-report-btn:hover{background:rgba(${rgb},.16)!important;border-color:rgba(${rgb},.45)!important}
    .mbtn-save{background:${a}!important;border-color:rgba(${rgb},.5)!important}
    .mbtn-save:hover{background:${a2}!important}
    .modal-box,.confirm-box{border-color:rgba(${rgb},.2)!important}
    .ec-edit{background:rgba(${rgb},.18)!important;color:${a2}!important}
    .ec-edit:hover{background:rgba(${rgb},.45)!important}
    .chip{border-color:rgba(${rgb},.15)!important}
    .tbar-btn:hover{border-color:rgba(${rgb},.3)!important}
  `;
}

function applyCustom(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const lighter=`#${Math.min(255,r+35).toString(16).padStart(2,'0')}${Math.min(255,g+35).toString(16).padStart(2,'0')}${Math.min(255,b+35).toString(16).padStart(2,'0')}`;
  applyTheme(hex,lighter,`${r},${g},${b}`);
  activeThemeIdx=-1;buildSwatches();
}

function toggleThemePanel(e){e.stopPropagation();document.getElementById('themePanel').classList.toggle('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.theme-wrap'))document.getElementById('themePanel').classList.remove('open')});

/* load saved theme */
(function(){
  try{const t=JSON.parse(localStorage.getItem('cai_theme')||'null');if(t){applyTheme(t.a,t.a2,t.rgb);const i=THEMES.findIndex(x=>x.a===t.a);activeThemeIdx=i>=0?i:-1;document.getElementById('customColor').value=t.a;}}catch(e){}
  buildSwatches();
})();

/* ── EXPAND / COLLAPSE ALL ── */
function expandAll(n){exp.add(n.id);(n.children||[]).forEach(c=>expandAll(c))}
function doExpandAll(){expandAll(ORG);render()}
function doCollapseAll(){exp.clear();crumbs=[];render()}

/* ── STATS ── */
const LEVEL_META={
  tchro:{label:'CHRO / C-Suite',color:'#b87414'},
  tdir:{label:'Director',color:'#1a7cc1'},
  thead:{label:'Head / Lead',color:'#0b8c80'},
  tmgr:{label:'Manager',color:'#167848'},
  tspec:{label:'Specialist',color:'#6a38c4'},
  texec:{label:'Senior / Exec',color:'#105ea8'},
  tasc:{label:'Associate',color:'#3c4e66'},
};
function computeStats(n,s={levels:{},locs:{},total:0}){
  s.total++;s.levels[n.t]=(s.levels[n.t]||0)+1;
  if(n.location){const loc=n.location.split(',').slice(-1)[0].trim();s.locs[loc]=(s.locs[loc]||0)+1;}
  (n.children||[]).forEach(c=>computeStats(c,s));return s;
}
function toggleStatsPanel(e){
  e.stopPropagation();
  const p=document.getElementById('statsPanel');
  const open=p.classList.toggle('open');
  document.getElementById('expPanel').classList.remove('open');
  document.getElementById('themePanel').classList.remove('open');
  if(open)renderStats();
}
function renderStats(){
  const s=computeStats(ORG);
  const maxL=Math.max(...Object.values(s.levels));
  const topLocs=Object.entries(s.locs).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxLoc=topLocs[0]?.[1]||1;
  let html=`<div class="sp-head">Headcount Overview</div>
  <div class="sp-total"><span class="sp-num">${s.total}</span><span class="sp-lbl">Total Staff</span></div>
  <div class="sp-section">By Level</div>`;
  Object.entries(LEVEL_META).forEach(([k,m])=>{
    const c=s.levels[k]||0;if(!c)return;
    const pct=Math.round(c/maxL*100);
    html+=`<div class="sp-row"><div class="sp-dot" style="background:${m.color}"></div><span class="sp-rlbl">${m.label}</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:${pct}%;background:${m.color}40"></div></div><span class="sp-cnt">${c}</span></div>`;
  });
  if(topLocs.length){
    html+=`<div class="sp-section">By Location</div>`;
    topLocs.forEach(([loc,c])=>{
      const pct=Math.round(c/maxLoc*100);
      html+=`<div class="sp-row"><span class="sp-rlbl" style="color:var(--text2)">${loc}</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:${pct}%;background:rgba(100,148,200,.35)"></div></div><span class="sp-cnt">${c}</span></div>`;
    });
  }
  document.getElementById('statsPanel').innerHTML=html;
}
document.addEventListener('click',e=>{if(!e.target.closest('.stats-wrap'))document.getElementById('statsPanel').classList.remove('open')});

/* ── EXPORT ── */
function toggleExpPanel(e){
  e.stopPropagation();
  document.getElementById('expPanel').classList.toggle('open');
  document.getElementById('statsPanel').classList.remove('open');
  document.getElementById('themePanel').classList.remove('open');
}
document.addEventListener('click',e=>{if(!e.target.closest('.exp-wrap'))document.getElementById('expPanel').classList.remove('open')});

async function exportPNG(){
  document.getElementById('expPanel').classList.remove('open');
  const wasExp=new Set(exp);const wasCrumbs=[...crumbs];
  expandAll(ORG);render();
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const treeEl=document.getElementById('tree');
  const bg=document.body.style.backgroundColor||'#060c1a';
  try{
    const canvas=await html2canvas(treeEl,{backgroundColor:bg,scale:2,useCORS:true,logging:false});
    const a=document.createElement('a');a.download='cai-org-chart.png';a.href=canvas.toDataURL('image/png');a.click();
  }catch(err){alert('Export failed. Please try Print / PDF instead.');}
  exp=wasExp;crumbs=wasCrumbs;render();
}
function printChart(){
  document.getElementById('expPanel').classList.remove('open');
  expandAll(ORG);render();
  setTimeout(()=>window.print(),200);
}

/* ── PHOTO UPLOAD ── */
function handlePhotoUpload(input){
  const file=input.files[0];if(!file)return;
  if(file.size>2*1024*1024){alert('Photo must be under 2 MB');return;}
  const r=new FileReader();
  r.onload=e=>{pendingPhoto=e.target.result;updatePhotoPreview();};
  r.readAsDataURL(file);
}
function clearPhoto(){pendingPhoto=null;document.getElementById('fPhoto').value='';updatePhotoPreview();}
function updatePhotoPreview(nameHint){
  const prev=document.getElementById('photoPreview');
  const clearBtn=document.getElementById('photoClearBtn');
  if(pendingPhoto){
    prev.innerHTML=`<img src="${pendingPhoto}" alt="preview">`;
    clearBtn.style.display='block';
  } else {
    const nm=nameHint||document.getElementById('fName').value||'?';
    document.getElementById('photoInitials').textContent=ini(nm)||'?';
    prev.innerHTML=`<span id="photoInitials">${ini(nm)||'?'}</span>`;
    clearBtn.style.display='none';
  }
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.getElementById('confirmDel').addEventListener('click',function(e){if(e.target===this)closeConfirm()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeConfirm();}
  if(e.key==='Enter'&&document.getElementById('modal').classList.contains('open')&&e.target.tagName==='INPUT')saveModal();
});

render();
