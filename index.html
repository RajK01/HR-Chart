<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CAI Software — HR Org Chart</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--font:'Plus Jakarta Sans',sans-serif;--bg:#04030a;--card-dark:rgba(10,8,22,0.96)}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:#eeeeff;min-height:100vh;overflow-x:hidden}

/* ── AURORA BG ── */
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── DOT GRID ── */
body::before{
  content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,0.06) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%);
}

/* ══ HEADER ══ */
header{
  position:relative;z-index:200;display:flex;align-items:center;flex-wrap:wrap;
  padding:0 24px;height:68px;
  background:rgba(4,3,10,0.88);backdrop-filter:blur(30px);
  border-bottom:1px solid rgba(255,255,255,0.07);
  gap:0;
}
.gem{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:conic-gradient(from 0deg,#7c3aed,#ec4899,#f59e0b,#10b981,#06b6d4,#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:17px;color:#fff;
  animation:spinGem 8s linear infinite;
  box-shadow:0 0 24px rgba(124,58,237,0.5);
}
@keyframes spinGem{to{filter:hue-rotate(360deg)}}
.brand{margin-left:12px;font-size:17px;font-weight:900;letter-spacing:-.4px;white-space:nowrap}
.b1{background:linear-gradient(90deg,#a78bfa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.b2{color:rgba(238,238,255,.9)}
.hpipe{width:1px;height:28px;background:rgba(255,255,255,0.08);margin:0 18px;flex-shrink:0}
.htag{
  font-size:12.5px;font-weight:600;white-space:nowrap;
  background:linear-gradient(90deg,#c4b5fd,#f9a8d4,#67e8f9,#c4b5fd);
  background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:flowGrad 5s linear infinite;
}
@keyframes flowGrad{to{background-position:-300%}}
.hr{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  border-radius:30px;padding:5px 13px;font-size:11.5px;color:#7f7d9a;white-space:nowrap;
}
.chip b{color:#eeeeff;font-weight:700}
.ping{width:7px;height:7px;border-radius:50%;background:#34d399;flex-shrink:0;
  animation:livePing 1.8s ease-in-out infinite}
@keyframes livePing{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}60%{box-shadow:0 0 0 7px rgba(52,211,153,0)}}

/* ══ TOOLBAR ══ */
.bar{
  position:relative;z-index:200;display:flex;align-items:center;gap:10px;
  padding:10px 24px;background:rgba(4,3,10,0.60);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:wrap;
}
.sw{position:relative;flex-shrink:0}
.sw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#7f7d9a;pointer-events:none}
#search{
  width:220px;padding:8px 12px 8px 36px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);
  border-radius:11px;font-size:12.5px;color:#eeeeff;outline:none;font-family:var(--font);
  transition:all .22s;
}
#search::placeholder{color:#7f7d9a}
#search:focus{background:rgba(124,58,237,0.1);border-color:rgba(124,58,237,0.5);box-shadow:0 0 0 3px rgba(124,58,237,0.1)}
#bc{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:#7f7d9a;min-width:0}
.bch,.bln{cursor:pointer;color:#a78bfa;font-weight:600;white-space:nowrap}
.bch:hover,.bln:hover{color:#fff}
.bsp{color:rgba(255,255,255,0.15)}
.bcu{color:#eeeeff;font-weight:800;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
#rstBtn{
  margin-left:auto;flex-shrink:0;
  background:linear-gradient(135deg,rgba(124,58,237,.2),rgba(236,72,153,.15));
  border:1px solid rgba(124,58,237,.35);color:#c4b5fd;border-radius:11px;
  padding:7px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .2s;
}
#rstBtn:hover{background:linear-gradient(135deg,rgba(124,58,237,.4),rgba(236,72,153,.3));color:#fff}

/* ══ TREE ══ */
#tree{position:relative;z-index:5;padding:48px 24px 100px;overflow-x:auto;min-height:calc(100vh - 140px)}
.tree-title{
  text-align:center;margin-bottom:40px;font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;
  background:linear-gradient(90deg,rgba(167,139,250,0),#a78bfa,#f9a8d4,#67e8f9,rgba(167,139,250,0));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200%;animation:flowGrad 4s linear infinite;
}

/* ══ LAYOUT ══ */
.tcol{display:flex;flex-direction:column;align-items:center}
.trow{display:flex;align-items:flex-start;gap:20px;justify-content:center;flex-wrap:nowrap}
.vl{width:2px;align-self:center;border-radius:2px;position:relative;
    background:linear-gradient(to bottom,rgba(139,92,246,.9),rgba(139,92,246,.05))}
.vl::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translate(-50%,0);
  width:8px;height:8px;border-radius:50%;background:#8b5cf6;
  box-shadow:0 0 14px 4px rgba(139,92,246,.8)}
.hl{height:2px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.55),transparent);border-radius:2px}
.cv{width:2px;height:24px;align-self:center;border-radius:2px;
    background:linear-gradient(to bottom,rgba(139,92,246,.5),rgba(139,92,246,.05))}

/* ══════════════════════════════
   CARD  —  fixed hover text bug
   ══════════════════════════════ */
.card{
  width:180px;
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;position:relative;
  isolation:isolate;          /* ← new stacking context, kills z-index bleed */
}
.card.leaf{cursor:default}
.card.smatch .orb-ring{
  outline:3px solid rgba(251,191,36,.7);outline-offset:3px;
  box-shadow:0 0 24px rgba(251,191,36,.5)!important;
}

/* ── ORB ── */
.orb-wrap{position:relative;z-index:2;margin-bottom:0}
.orb-ring{
  width:82px;height:82px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--c1,#7c3aed),var(--c2,#ec4899),var(--c1,#7c3aed));
  display:flex;align-items:center;justify-content:center;
  padding:3px;
  box-shadow:0 0 28px var(--gl,rgba(124,58,237,.5));
  animation:spinRing 6s linear infinite;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s;
}
@keyframes spinRing{to{filter:hue-rotate(360deg)}}
.card:not(.leaf):hover .orb-ring,
.card.expanded .orb-ring{
  transform:scale(1.12);
  box-shadow:0 0 50px var(--gl,rgba(124,58,237,.7)),0 0 90px var(--gl,rgba(124,58,237,.25));
}

.orb-face{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--c1l,#9d6fff),var(--c1,#7c3aed) 58%,#06040f 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;color:#fff;letter-spacing:-.5px;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
  position:relative;overflow:hidden;
}
.orb-face::before{
  content:'';position:absolute;top:-30%;left:-20%;
  width:55%;height:55%;border-radius:50%;
  background:rgba(255,255,255,0.2);filter:blur(7px);pointer-events:none;
}

.sdot{
  position:absolute;bottom:2px;right:2px;
  width:14px;height:14px;border-radius:50%;
  background:var(--dot,#34d399);
  border:2.5px solid #04030a;
  box-shadow:0 0 8px var(--dot,rgba(52,211,153,.7));
}

/* ── FLOATING BADGE ── */
.badge-float{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  white-space:nowrap;z-index:3;
  font-size:8.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  background:var(--ba,rgba(124,58,237,.3));
  color:var(--bt,#c4b5fd)!important;          /* !important keeps color on hover */
  border:1px solid var(--bb,rgba(124,58,237,.5));
  border-radius:20px;padding:3px 9px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 10px var(--gl,rgba(124,58,237,.25));
}

/* ── PANEL ── */
.panel{
  margin-top:-14px;width:100%;
  background:var(--card-dark);           /* stays dark always */
  border:1px solid rgba(255,255,255,0.09);
  border-radius:18px;
  padding:22px 14px 14px;
  text-align:center;
  position:relative;z-index:1;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,border-color .25s;
  box-shadow:0 10px 36px rgba(0,0,0,.55);
  overflow:hidden;                         /* clips inner shimmer */
}

/* top color line */
.panel::before{
  content:'';position:absolute;top:0;left:16px;right:16px;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--c1,#7c3aed),var(--c2,#ec4899),transparent);
  opacity:.75;pointer-events:none;
}

/* shimmer on hover — stays INSIDE panel, no z-index bleed */
.panel::after{
  content:'';position:absolute;inset:0;border-radius:18px;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,0.04) 50%,transparent 65%);
  transform:translateX(-100%);pointer-events:none;
  transition:transform .55s ease;
}
.card:not(.leaf):hover .panel::after{transform:translateX(100%)}

/* hover lift — NO background change (keeps text readable) */
.card:not(.leaf):hover .panel,
.card.expanded .panel{
  transform:translateY(-5px);
  border-color:rgba(255,255,255,0.18);
  box-shadow:0 22px 60px rgba(0,0,0,.65),0 0 36px var(--gl,rgba(124,58,237,.12));
}
.card.expanded .panel{border-color:var(--bb,rgba(124,58,237,.4))}

/* ── TEXT — always white ── */
.pname{font-size:13.5px;font-weight:800;color:#fff!important;margin-bottom:3px;line-height:1.25;letter-spacing:-.15px}
.ptitle{font-size:10.5px;color:rgba(200,198,230,0.7)!important;line-height:1.45;margin-bottom:9px}
.ploc{display:flex;align-items:center;justify-content:center;gap:4px;font-size:10px;color:rgba(180,178,210,0.65)!important;margin-bottom:12px}
.pfooter{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid rgba(255,255,255,0.07)}
.preps{display:flex;align-items:center;gap:4px;font-size:11px;color:rgba(200,198,230,.7)!important}
.preps b{color:#fff!important;font-weight:700}
.pvbtn{
  display:flex;align-items:center;gap:4px;
  font-size:11px;font-weight:800;
  padding:4px 11px;border-radius:20px;
  background:var(--ba,rgba(124,58,237,.18));
  color:var(--bt,#c4b5fd)!important;
  border:1px solid var(--bb,rgba(124,58,237,.35));
  transition:background .2s;white-space:nowrap;
  text-shadow:none;
}
.card:not(.leaf):hover .pvbtn,
.card.expanded .pvbtn{background:var(--bah,rgba(124,58,237,.32));color:#fff!important}
.parr{display:inline-block;transition:transform .3s cubic-bezier(.34,1.56,.64,1);font-size:9px;color:inherit}
.card.expanded .parr{transform:rotate(90deg)}
.pnrep{font-size:10px;color:rgba(127,125,154,.5)!important;display:flex;align-items:center;gap:3px}

/* ══ ROLE THEMES ══ */
.tchro{--c1:#f59e0b;--c2:#ef4444;--c1l:#fcd34d;--gl:rgba(245,158,11,.55);--ba:rgba(245,158,11,.2);--bt:#fcd34d;--bb:rgba(245,158,11,.5);--bah:rgba(245,158,11,.38);--dot:#34d399}
.tdir {--c1:#8b5cf6;--c2:#6366f1;--c1l:#b89dfa;--gl:rgba(139,92,246,.55);--ba:rgba(139,92,246,.2);--bt:#c4b5fd;--bb:rgba(139,92,246,.5);--bah:rgba(139,92,246,.38);--dot:#34d399}
.thead{--c1:#f97316;--c2:#f43f5e;--c1l:#fdba74;--gl:rgba(249,115,22,.55);--ba:rgba(249,115,22,.2);--bt:#fdba74;--bb:rgba(249,115,22,.5);--bah:rgba(249,115,22,.38);--dot:#34d399}
.tmgr {--c1:#10b981;--c2:#06b6d4;--c1l:#6ee7b7;--gl:rgba(16,185,129,.55);--ba:rgba(16,185,129,.2);--bt:#6ee7b7;--bb:rgba(16,185,129,.5);--bah:rgba(16,185,129,.38);--dot:#34d399}
.tspec{--c1:#f43f5e;--c2:#ec4899;--c1l:#fda4af;--gl:rgba(244,63,94,.55);--ba:rgba(244,63,94,.2);--bt:#fda4af;--bb:rgba(244,63,94,.5);--bah:rgba(244,63,94,.38);--dot:#fbbf24}
.texec{--c1:#a855f7;--c2:#ec4899;--c1l:#d8b4fe;--gl:rgba(168,85,247,.55);--ba:rgba(168,85,247,.2);--bt:#e9d5ff;--bb:rgba(168,85,247,.5);--bah:rgba(168,85,247,.38);--dot:#a78bfa}
.tasc {--c1:#64748b;--c2:#94a3b8;--c1l:#cbd5e1;--gl:rgba(100,116,139,.45);--ba:rgba(100,116,139,.18);--bt:#cbd5e1;--bb:rgba(100,116,139,.45);--bah:rgba(100,116,139,.32);--dot:#94a3b8}

/* ══ CHILDREN ANIM ══ */
.csec{display:flex;flex-direction:column;align-items:center;animation:popIn .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:translateY(-14px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ══ LEGEND ══ */
.legend{
  position:fixed;bottom:20px;right:22px;z-index:300;
  background:rgba(4,3,10,0.90);backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,0.08);border-radius:16px;
  padding:14px 16px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
}
.ltitle{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#7f7d9a;margin-bottom:3px}
.lrow{display:flex;align-items:center;gap:7px;font-size:10.5px;color:rgba(238,238,255,.7)}
.ldot{width:10px;height:10px;border-radius:50%;flex-shrink:0;animation:spinRing 5s linear infinite}

/* ══════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════ */

/* ── Tablet ≤ 900px ── */
@media(max-width:900px){
  header{padding:0 16px;height:60px}
  .gem{width:34px;height:34px;font-size:15px}
  .brand{font-size:15px;margin-left:10px}
  .hpipe,.htag{display:none}
  .chip{padding:4px 10px;font-size:11px}
  .bar{padding:9px 16px;gap:8px}
  #search{width:180px;font-size:12px}
  #tree{padding:32px 16px 80px}
  .card{width:155px}
  .orb-ring{width:70px;height:70px}
  .orb-face{font-size:17px}
  .badge-float{font-size:7.5px;padding:2px 7px;top:-12px}
  .panel{padding:18px 11px 12px;border-radius:15px}
  .pname{font-size:12px}
  .ptitle{font-size:9.5px}
  .ploc{font-size:9px}
  .trow{gap:14px}
  .legend{bottom:14px;right:14px;padding:11px 13px}
  .lrow{font-size:10px}
}

/* ── Mobile ≤ 600px ── */
@media(max-width:600px){
  header{padding:0 14px;height:56px}
  .gem{width:30px;height:30px;font-size:13px;border-radius:9px}
  .brand{font-size:14px;margin-left:9px}
  .hr .chip:last-child{display:none}
  .bar{padding:8px 14px;gap:7px}
  #search{width:140px;font-size:11.5px;padding:7px 12px 7px 34px}
  #bc{display:none}   /* hide breadcrumb on very small screens */
  #rstBtn{padding:6px 12px;font-size:11.5px}
  #tree{padding:24px 10px 70px;overflow-x:auto}
  /* mobile: let tree scroll horizontally, don't wrap */
  .trow{gap:10px;flex-wrap:nowrap;width:max-content}
  .card{width:136px}
  .orb-ring{width:62px;height:62px}
  .orb-face{font-size:15px}
  .badge-float{font-size:7px;padding:2px 6px;top:-11px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .panel{padding:16px 10px 11px;border-radius:13px}
  .pname{font-size:11.5px}
  .ptitle{font-size:9px;margin-bottom:6px}
  .ploc{font-size:8.5px;margin-bottom:8px}
  .pvbtn{font-size:10px;padding:3px 9px}
  .preps{font-size:10px}
  .pfooter{flex-direction:column;align-items:center;gap:6px}
  .legend{bottom:10px;right:10px;padding:10px 12px;border-radius:12px}
  .ltitle{font-size:8.5px}
  .lrow{font-size:9.5px;gap:6px}
  .ldot{width:9px;height:9px}
  .tree-title{font-size:9px;letter-spacing:2px;margin-bottom:28px}
}

/* ── Very small ≤ 400px ── */
@media(max-width:400px){
  .card{width:118px}
  .orb-ring{width:54px;height:54px}
  .orb-face{font-size:13px}
  .trow{gap:8px}
  .legend{display:none}  /* hide legend on tiny screens */
}
</style>
</head>
<body>

<canvas id="aurora"></canvas>

<header>
  <div class="gem">C</div>
  <div class="brand"><span class="b1">CAI</span><span class="b2"> Software</span></div>
  <div class="hpipe"></div>
  <div class="htag">Shared Services &nbsp;·&nbsp; HR Organisation</div>
  <div class="hr">
    <div class="chip"><span class="ping"></span>Live &nbsp;·&nbsp;<b id="ht">–</b></div>
    <div class="chip">Exp <b id="he">0</b></div>
  </div>
</header>

<div class="bar">
  <div class="sw">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="search" type="text" placeholder="Search name, role…"/>
  </div>
  <div id="bc"></div>
  <button id="rstBtn" onclick="rst()">↺ Reset</button>
</div>

<div id="tree"></div>


<script>
/* ══ AURORA ══ */
(function(){
  const c=document.getElementById('aurora'),ctx=c.getContext('2d');
  let W,H;
  const bands=[
    {y:.14,c1:'rgba(124,58,237,.16)',c2:'rgba(0,0,0,0)',spd:.0006,amp:.06},
    {y:.48,c1:'rgba(6,182,212,.11)',c2:'rgba(0,0,0,0)',spd:.0004,amp:.05},
    {y:.74,c1:'rgba(236,72,153,.09)',c2:'rgba(0,0,0,0)',spd:.0007,amp:.04},
  ];
  const bokeh=[
    {x:.08,y:.75,r:100,rgb:'124,58,237'},
    {x:.55,y:.20,r:130,rgb:'236,72,153'},
    {x:.88,y:.55,r:110,rgb:'6,182,212'},
    {x:.30,y:.85,r:90, rgb:'16,185,129'},
    {x:.72,y:.10,r:95, rgb:'245,158,11'},
    {x:.18,y:.30,r:85, rgb:'244,63,94'},
  ];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
  function draw(){
    const t=Date.now();
    ctx.clearRect(0,0,W,H);
    bands.forEach(b=>{
      const cy=(b.y+Math.sin(t*b.spd*.001)*b.amp)*H;
      const g=ctx.createRadialGradient(W*.5,cy,0,W*.5,cy,W*.6);
      g.addColorStop(0,b.c1);g.addColorStop(1,b.c2);
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    });
    bokeh.forEach((bk,i)=>{
      const ox=bk.x*W+Math.sin(t*.0003+i)*W*.04;
      const oy=bk.y*H+Math.cos(t*.00035+i*1.2)*H*.03;
      const a=.05+.025*Math.sin(t*.0008+i);
      const g2=ctx.createRadialGradient(ox,oy,0,ox,oy,bk.r);
      g2.addColorStop(0,`rgba(${bk.rgb},${a})`);g2.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
    });
    requestAnimationFrame(draw);
  }
  resize();draw();window.addEventListener('resize',resize);
})();

/* ══ DATA ══ */
const ORG={
  id:'chro',name:'Melissa Harvan',role:'Chief HR Officer',
  jobTitle:'Chief Human Resources Officer',location:'Global',t:'tchro',
  children:[
    {id:'ana',name:'Anastasija Cecurova-Herda',role:'Sr. HR Business Partner',

/* ══ STATE ══ */
let exp=new Set(),crumbs=[],sq='';
function cnt(n){return 1+(n.children||[]).reduce((s,c)=>s+cnt(c),0)}
const TOTAL=cnt(ORG);

/* ══ UTILS ══ */
function ini(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function el(tag,cls,html){const d=document.createElement(tag);if(cls)d.className=cls;if(html!==undefined)d.innerHTML=html;return d}
function pin(){return`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`}
function ppl(){return`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>`}

/* ══ CARD ══ */
function buildCard(node){
  const kids=node.children&&node.children.length>0;
  const isExp=exp.has(node.id);
  const match=sq&&(node.name.toLowerCase().includes(sq)||node.role.toLowerCase().includes(sq)||(node.location||'').toLowerCase().includes(sq));
  const card=el('div',`card ${node.t}${isExp?' expanded':''}${!kids?' leaf':''}${match?' smatch':''}`);
  card.innerHTML=`
    <div class="orb-wrap">
      <div class="badge-float">${node.role}</div>
      <div class="orb-ring"><div class="orb-face">${ini(node.name)}</div></div>
      <div class="sdot"></div>
    </div>
    <div class="panel">
      <div class="pname">${node.name}</div>
      <div class="ptitle">${node.jobTitle}</div>
      ${node.location?`<div class="ploc">${pin()}<span>${node.location}</span></div>`:''}
      <div class="pfooter">
        ${kids
          ?`<div class="preps">${ppl()}&nbsp;<b>${node.children.length}</b>&nbsp;rep${node.children.length>1?'s':''}</div>
            <div class="pvbtn"><span class="parr">▶</span>${isExp?'Hide':'View'}</div>`
          :`<div class="pnrep">${ppl()}&nbsp;No reports</div><div></div>`}
      </div>
    </div>`;

  /* 3-D tilt — only on desktop */
  if(kids && window.innerWidth > 768){
    card.addEventListener('mousemove',e=>{
      const r=card.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5;
      const y=(e.clientY-r.top)/r.height-.5;
      card.style.transform=`perspective(550px) rotateY(${x*12}deg) rotateX(${-y*8}deg)`;
    });
    card.addEventListener('mouseleave',()=>{card.style.transform=''});
    card.addEventListener('click',()=>toggle(node));
  } else if(kids){
    card.addEventListener('click',()=>toggle(node));
  }
  return card;
}

/* ══ TREE ══ */
function buildTree(node,depth){
  const col=el('div','tcol');
  col.appendChild(buildCard(node));
  if(exp.has(node.id)&&node.children&&node.children.length>0){
    const sec=el('div','csec');
    const vl=el('div','vl');vl.style.height='34px';sec.appendChild(vl);
    const kids=node.children;
    if(kids.length===1){
      sec.appendChild(buildTree(kids[0],depth+1));
    } else {
      const hw=el('div');hw.style.cssText='display:flex;flex-direction:column;align-items:stretch;';
      const hb=el('div','hl');hw.appendChild(hb);
      const row=el('div','trow');
      kids.forEach(kid=>{
        const dc=el('div','tcol');
        dc.appendChild(el('div','cv'));
        dc.appendChild(buildTree(kid,depth+1));
        row.appendChild(dc);
      });
      hw.appendChild(row);sec.appendChild(hw);
      requestAnimationFrame(()=>{
        const cols=row.querySelectorAll(':scope>.tcol');
        if(cols.length>1){
          const f=cols[0].getBoundingClientRect(),l=cols[cols.length-1].getBoundingClientRect();
          const w=hb.parentElement.getBoundingClientRect();
          hb.style.marginLeft=(f.left+f.width/2-w.left)+'px';
          hb.style.width=(l.left+l.width/2-f.left-f.width/2)+'px';
        } else hb.style.display='none';
      });
    }
    col.appendChild(sec);
  }
  return col;
}

/* ══ RENDER ══ */
function render(){
  const root=document.getElementById('tree');root.innerHTML='';
  const w=el('div');w.style.cssText='display:flex;flex-direction:column;align-items:center;';
  w.appendChild(el('div','tree-title','✦ &nbsp; Shared Services Leadership &nbsp; ✦'));
  w.appendChild(buildTree(ORG,0));root.appendChild(w);
  renderBC();
  document.getElementById('ht').textContent=TOTAL;
  document.getElementById('he').textContent=exp.size;
}
function renderBC(){
  const bc=document.getElementById('bc');bc.innerHTML='';
  const h=el('span','bch','Top Level');h.onclick=()=>{exp.clear();crumbs=[];render()};bc.appendChild(h);
  crumbs.forEach((it,i)=>{
    bc.appendChild(el('span','bsp',' › '));
    if(i===crumbs.length-1){bc.appendChild(el('span','bcu',it.name));}
    else{const lk=el('span','bln',it.name);lk.onclick=()=>{const idx=crumbs.indexOf(it);crumbs.slice(idx+1).forEach(x=>clps(find(ORG,x.id)));crumbs=crumbs.slice(0,idx+1);render()};bc.appendChild(lk);}
  });
}
function toggle(node){
  if(exp.has(node.id)){clps(node);crumbs=crumbs.filter(x=>x.id!==node.id);}
  else{exp.add(node.id);if(!crumbs.find(x=>x.id===node.id))crumbs.push({id:node.id,name:node.name});}
  render();
}
function clps(node){if(!node)return;exp.delete(node.id);(node.children||[]).forEach(c=>clps(c))}
function find(n,id){if(n.id===id)return n;for(const c of(n.children||[])){const f=find(c,id);if(f)return f}return null}
function rst(){exp.clear();crumbs=[];document.getElementById('search').value='';sq='';render()}
document.getElementById('search').addEventListener('input',function(){
  sq=this.value.trim().toLowerCase();if(sq)exS(ORG,sq);render();
});
function exS(n,q){
  const sm=n.name.toLowerCase().includes(q)||n.role.toLowerCase().includes(q)||(n.location||'').toLowerCase().includes(q);
  const cm=(n.children||[]).some(c=>subM(c,q));
  if((sm||cm)&&n.children&&n.children.length>0)exp.add(n.id);
  (n.children||[]).forEach(c=>exS(c,q));
}
function subM(n,q){
  if(n.name.toLowerCase().includes(q)||n.role.toLowerCase().includes(q)||(n.location||'').toLowerCase().includes(q))return true;
  return(n.children||[]).some(c=>subM(c,q));
}
render();
